<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#1D2731" />
    <meta name="description" content="Muhammad Asad Haye — e-commerce, digital growth, CRO, and technology." />
    <title>Muhammad Asad Haye | E-Commerce & Digital Experience Leader</title>
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { min-height: 100vh; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f8f9fa; color: #1d2731; }
      #root { min-height: 100vh; }
      .boot-fallback { box-sizing: border-box; min-height: 100vh; display: grid; place-content: center; padding: 2rem; text-align: center; }
      .boot-fallback h1 { margin: 0 0 .75rem; font-size: clamp(1.5rem, 4vw, 2.5rem); }
      .boot-fallback p { max-width: 38rem; margin: 0 auto; line-height: 1.6; color: #6c757d; }
    </style>
  </head>
  <body>
    <div id="root">
      <main class="boot-fallback" role="status" aria-live="polite">
        <div>
          <h1>Muhammad Asad Haye</h1>
          <p>Loading the portfolio… If this message remains visible, the site application could not start. Please refresh the page or try disabling browser extensions.</p>
        </div>
      </main>
    </div>
    <noscript>
      <main class="boot-fallback">
        <div>
          <h1>Muhammad Asad Haye</h1>
          <p>This portfolio requires JavaScript to display the full experience. Enable JavaScript and reload the page.</p>
        </div>
      </main>
    </noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
